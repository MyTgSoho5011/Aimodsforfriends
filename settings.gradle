pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }

    // Версия плагина объявлена один раз здесь, подпроекты пишут просто
    // `id 'fabric-loom'` (без версии). Меняя MC/Loom, правь это место.
    plugins {
        id 'fabric-loom' version '1.14-SNAPSHOT'
    }
}

rootProject.name = 'aimodsforfriends'

// Minecraft mods (Fabric Loom)
include 'soho-api'
include 'codeforge'

// Plain Java library used by CodeForge plugins
include 'codeforge-plugin-api'
