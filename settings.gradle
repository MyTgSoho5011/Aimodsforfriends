pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }

    // Версия плагина объявлена один раз здесь, подпроекты пишут просто
    // `id 'net.fabricmc.fabric-loom-remap'` (без версии).
    //
    // В Loom 1.14+ id-шники разделились:
    //   net.fabricmc.fabric-loom        - необфусцированные версии (MC 26.1+)
    //   net.fabricmc.fabric-loom-remap  - обфусцированные версии (1.21.11 и старше)
    //   fabric-loom                     - legacy, тянет не тот вариант для 1.21.11
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
    }
}

rootProject.name = 'aimodsforfriends'

// Minecraft mods (Fabric Loom)
include 'soho-api'
include 'codeforge'

// Plain Java library used by CodeForge plugins
include 'codeforge-plugin-api'
