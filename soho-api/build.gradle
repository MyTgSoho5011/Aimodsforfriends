plugins {
    id 'java-library'
}

version = project.soho_api_version
group = 'com.sohonet'

base {
    archivesName = 'soho-api'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    // Soho API не трогает классы Minecraft - ему нужен только Fabric Loader
    // (ModInitializer) и slf4j. Поэтому это обычная java-library, а не
    // Loom-проект: так CodeForge зависит от неё, не читая mod-метаданные
    // чужого проекта на этапе конфигурации.
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Soho API',
            'Implementation-Version': project.version
        )
    }
}
