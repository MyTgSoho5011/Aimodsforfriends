name: Build mods

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build every module
        run: gradle build --no-daemon --stacktrace

      - name: Collect jars
        run: gradle collectJars --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            build/dist/*.jar
            */build/libs/*.jar
          if-no-files-found: warn
