name: Build mods

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Выложить собранные jar-ники в папку Releases/ и в GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build every module
        id: build
        continue-on-error: true
        run: |
          mkdir -p ci
          {
            echo "### gradle build ($(date -u +%FT%TZ))"
            echo "### java: $(java -version 2>&1 | head -1)"
            echo "### gradle: $(gradle --version 2>&1 | grep -E '^Gradle')"
          } > ci/last-build.log
          set +e
          gradle build --no-daemon --console=plain >> ci/last-build.log 2>&1
          CODE=$?
          set -e
          echo "BUILD_EXIT=$CODE" >> ci/last-build.log
          # Короткая выжимка: то, что реально нужно прочитать человеку/агенту.
          {
            echo "### summary"
            grep -nE '^FAILURE:|^\* What went wrong:|^> |error:|Could not (resolve|find|create|open|compile)|Plugin \[id|Unsupported class|requires|warning: \[options\]' ci/last-build.log | head -n 80 || true
            echo "### context"
            sed -n '/\* What went wrong:/,/\* Try:/p' ci/last-build.log | head -n 60 || true
            echo "### build output tail"
            grep -vE '^\s+at |^\s+\.\.\. [0-9]+ more' ci/last-build.log | tail -n 40 || true
          } > ci/summary.log
          cat ci/summary.log
          exit $CODE

      - name: Collect jars
        if: steps.build.outcome == 'success'
        run: gradle collectJars --no-daemon --console=plain

      - name: Verify jar layout
        if: steps.build.outcome == 'success'
        run: |
          set -e
          echo "### built jars"
          ls -l */build/libs/*.jar | grep -v -E 'sources|dev' || true
          CF=codeforge/build/libs/codeforge-3.0.0.jar
          echo "### $CF"
          jar tf "$CF" | grep -E '^(com/sohonet|assets|fabric.mod.json|META-INF/jars)' | head -n 40
          jar tf "$CF" | grep -q 'com/sohonet/codeforge/CodeForgeClient.class'
          jar tf "$CF" | grep -q 'fabric.mod.json'
          jar tf "$CF" | grep -q 'META-INF/jars/.*ecj'
          jar tf "$CF" | grep -q 'META-INF/jars/.*soho-api'

      # Публикация только по явному запросу: workflow_dispatch с publish=true
      # или пуш тега вида v*.
      - name: Publish jars into Releases/ and create a GitHub Release
        if: steps.build.outcome == 'success' && (inputs.publish || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MISE=codeforge/build/libs/codeforge-3.0.0.jar
          SOHO=soho-api/build/libs/soho-api-1.0.0.jar
          API=codeforge-plugin-api/build/libs/codeforge-plugin-api-1.0.0.jar
          for f in "$MISE" "$SOHO" "$API"; do test -f "$f" || { echo "::error title=missing jar::$f"; exit 1; }; done

          # 1) раскладываем по папкам: Releases/<мод>/<версия>/<файл>
          mkdir -p Releases/codeforge/3.0.0 Releases/soho-api/1.0.0 Releases/codeforge-plugin-api/1.0.0
          cp "$MISE" Releases/codeforge/3.0.0/
          cp "$SOHO" Releases/soho-api/1.0.0/
          cp "$API"  Releases/codeforge-plugin-api/1.0.0/
          cat > Releases/README.md <<'MD'
          # Releases

          Готовые jar-ники, собранные CI (см. `.github/workflows/build.yml`).
          Кладите файлы в `.minecraft/mods`.

          | Папка | Файл | Что это |
          |---|---|---|
          | `codeforge/3.0.0/` | `codeforge-3.0.0.jar` | Консоль CodeForge. Внутри уже `soho-api` и ECJ (jar-in-jar) — ставить один файл |
          | `soho-api/1.0.0/` | `soho-api-1.0.0.jar` | Soho API отдельным файлом (необязательно, если стоит `codeforge`) |
          | `codeforge-plugin-api/1.0.0/` | `codeforge-plugin-api-1.0.0.jar` | API для плагинов CodeForge (в игру не ставится) |

          Собранo под Minecraft **1.21.11**, Fabric Loader 0.18.4, Fabric API 0.141.2+1.21.11, Java 21.
          MD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Releases
          if git diff --cached --quiet; then
            echo "Releases/ не изменилась"
          else
            git commit -m "release: jar-ники CodeForge 3.0.0 / Soho API 1.0.0 / Plugin API 1.0.0"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          # 2) GitHub Release с теми же файлами
          TAG="v3.0.0"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG"
            git push -f origin "$TAG" || echo "::warning title=tag push failed::тег $TAG не запушен"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "CodeForge 3.0.0 (MC 1.21.11)" \
              --notes "Сборка из CI. Внутри: CodeForge (консоль с компиляцией на лету), Soho API, CodeForge Plugin API. Ставить: codeforge-3.0.0.jar в .minecraft/mods (остальное уже внутри него)." || true
          gh release upload "$TAG" "$MISE" "$SOHO" "$API" --clobber || true

      - name: Upload mod jars
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            build/dist/*.jar
            */build/libs/*.jar
          if-no-files-found: warn

      - name: Diagnose access widener sources
        if: steps.build.outcome != 'success'
        run: |
          {
          echo "### jars in the Gradle cache that declare an access widener"
          python3 - <<'PY'
          import json, pathlib, zipfile
          roots = [pathlib.Path.home() / '.gradle' / 'caches' / 'modules-2']
          found = 0
          for root in roots:
              for jar in root.rglob('*.jar'):
                  try:
                      if jar.stat().st_size > 60_000_000:
                          continue
                      with zipfile.ZipFile(jar) as z:
                          names = set(z.namelist())
                          if 'fabric.mod.json' not in names:
                              continue
                          meta = json.loads(z.read('fabric.mod.json'))
                          aw = meta.get('accessWidener')
                          if not aw:
                              continue
                          header = ''
                          if aw in names:
                              header = z.read(aw).decode('utf-8', 'replace').splitlines()[0]
                          print(f"{jar.name} [{meta.get('id')}] -> {aw} :: {header}")
                          found += 1
                  except Exception:
                      continue
          print('total:', found)
          PY
          } > ci/diagnose.log 2>&1
          cat ci/diagnose.log
          # аннотации читаются агентом, обычный stdout шага - нет
          printf '\n### diagnose\n' >> ci/summary.log
          cat ci/diagnose.log >> ci/summary.log

      - name: Dump Minecraft API signatures
        if: steps.build.outcome != 'success'
        run: |
          {
            CP=$(find .gradle/loom-cache "$HOME/.gradle/caches/fabric-loom" -name '*.jar' 2>/dev/null \
                 | grep -v -E 'sources|javadoc' | tr '\n' ':')
            dump() {
              echo "===== $1"
              javap -classpath "$CP" -public "$1" 2>&1 | grep -vE '^Compiled from|^\}|^\{' | head -n "${2:-45}"
            }
            dump net.minecraft.client.gui.widget.EditBoxWidget 30
            dump 'net.minecraft.client.gui.widget.EditBoxWidget$Builder' 30
            dump net.minecraft.client.input.KeyInput 25
            dump net.minecraft.client.input.CharInput 25
            dump net.minecraft.client.gui.Click 25
            dump net.minecraft.client.input.MouseInput 20
            echo "===== Screen (input/render only)"
            javap -classpath "$CP" -public net.minecraft.client.gui.screen.Screen 2>&1 \
              | grep -E 'keyPressed|mouseClicked|mouseDragged|mouseScrolled|charTyped|render\(|init\(|close\(|shouldPause|getTitle|addDrawableChild|clearChildren|setInitialFocus|width|height' | head -n 30
            echo "===== Element/ParentElement"
            javap -classpath "$CP" -public net.minecraft.client.gui.Element net.minecraft.client.gui.ParentElement 2>&1 \
              | grep -E 'keyPressed|mouseClicked|mouseDragged|mouseScrolled|charTyped' | head -n 20
            dump net.minecraft.client.gui.widget.MultilineTextWidget 20
            dump net.minecraft.client.gui.widget.ButtonWidget 25
            dump 'net.minecraft.client.gui.widget.ButtonWidget$Builder' 20
            dump net.minecraft.client.gui.widget.TextFieldWidget 25
            echo "===== KeyBinding ctors"
            javap -classpath "$CP" -public net.minecraft.client.option.KeyBinding 2>&1 | grep -E 'KeyBinding\(' | head -n 6
          } > ci/api.log 2>&1
          cat ci/api.log
          printf '\n### api\n' >> ci/summary.log
          cat ci/api.log >> ci/summary.log

      # Логи Actions качаются с results-receiver.actions.githubusercontent.com,
      # который недоступен части агентов, поэтому дублируем лог сборки
      # аннотациями чек-рана - они читаются обычным GET /check-runs/{id}/annotations.
      - name: Expose build log as check-run annotations
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse
          path = pathlib.Path('ci/summary.log')
          if not path.exists():
              print('::error title=no-log::ci/summary.log was not produced')
              raise SystemExit(0)
          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()[-400:]
          chunks, cur, size = [], [], 0
          for line in lines:
              cur.append(line)
              size += len(line) + 1
              if size > 6000:
                  chunks.append('\n'.join(cur)); cur, size = [], 0
          if cur:
              chunks.append('\n'.join(cur))
          total = len(chunks)
          for i, chunk in enumerate(chunks[:10]):
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=build log {i+1} of {min(total, 10)}::{escaped}")
          PY

      - name: Fail the job if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
