name: Build mods

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build every module
        id: build
        continue-on-error: true
        run: |
          mkdir -p ci
          {
            echo "### gradle build ($(date -u +%FT%TZ))"
            echo "### java: $(java -version 2>&1 | head -1)"
            echo "### gradle: $(gradle --version 2>&1 | grep -E '^Gradle')"
          } > ci/last-build.log
          set +e
          gradle build --no-daemon --console=plain >> ci/last-build.log 2>&1
          CODE=$?
          set -e
          echo "BUILD_EXIT=$CODE" >> ci/last-build.log
          # Короткая выжимка: то, что реально нужно прочитать человеку/агенту.
          {
            echo "### summary"
            grep -nE '^FAILURE:|^\* What went wrong:|^> |error:|Could not (resolve|find|create|open|compile)|Plugin \[id|Unsupported class|requires|warning: \[options\]' ci/last-build.log | head -n 80 || true
            echo "### context"
            sed -n '/\* What went wrong:/,/\* Try:/p' ci/last-build.log | head -n 60 || true
            echo "### build output tail"
            grep -vE '^\s+at |^\s+\.\.\. [0-9]+ more' ci/last-build.log | tail -n 40 || true
          } > ci/summary.log
          cat ci/summary.log
          exit $CODE

      - name: Collect jars
        if: steps.build.outcome == 'success'
        run: gradle collectJars --no-daemon --console=plain

      - name: Upload mod jars
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            build/dist/*.jar
            */build/libs/*.jar
          if-no-files-found: warn

      - name: Diagnose access widener sources
        if: steps.build.outcome != 'success'
        run: |
          {
          echo "### jars in the Gradle cache that declare an access widener"
          python3 - <<'PY'
          import json, pathlib, zipfile
          roots = [pathlib.Path.home() / '.gradle' / 'caches' / 'modules-2']
          found = 0
          for root in roots:
              for jar in root.rglob('*.jar'):
                  try:
                      if jar.stat().st_size > 60_000_000:
                          continue
                      with zipfile.ZipFile(jar) as z:
                          names = set(z.namelist())
                          if 'fabric.mod.json' not in names:
                              continue
                          meta = json.loads(z.read('fabric.mod.json'))
                          aw = meta.get('accessWidener')
                          if not aw:
                              continue
                          header = ''
                          if aw in names:
                              header = z.read(aw).decode('utf-8', 'replace').splitlines()[0]
                          print(f"{jar.name} [{meta.get('id')}] -> {aw} :: {header}")
                          found += 1
                  except Exception:
                      continue
          print('total:', found)
          PY
          } > ci/diagnose.log 2>&1
          cat ci/diagnose.log
          # аннотации читаются агентом, обычный stdout шага - нет
          printf '\n### diagnose\n' >> ci/summary.log
          cat ci/diagnose.log >> ci/summary.log

      # Логи Actions качаются с results-receiver.actions.githubusercontent.com,
      # который недоступен части агентов, поэтому дублируем лог сборки
      # аннотациями чек-рана - они читаются обычным GET /check-runs/{id}/annotations.
      - name: Expose build log as check-run annotations
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse
          path = pathlib.Path('ci/summary.log')
          if not path.exists():
              print('::error title=no-log::ci/summary.log was not produced')
              raise SystemExit(0)
          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()[-400:]
          chunks, cur, size = [], [], 0
          for line in lines:
              cur.append(line)
              size += len(line) + 1
              if size > 6000:
                  chunks.append('\n'.join(cur)); cur, size = [], 0
          if cur:
              chunks.append('\n'.join(cur))
          total = len(chunks)
          for i, chunk in enumerate(chunks[:10]):
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=build log {i+1} of {min(total, 10)}::{escaped}")
          PY

      - name: Fail the job if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
