name: Build mods

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build every module
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci
          {
            echo "### gradle build ($(date -u +%FT%TZ))"
            echo "### java: $(java -version 2>&1 | head -1)"
            echo "### gradle: $(gradle --version 2>&1 | grep -E '^Gradle' )"
          } > ci/last-build.log
          gradle build --no-daemon --stacktrace --console=plain >> ci/last-build.log 2>&1
          echo "BUILD_EXIT=$?" >> ci/last-build.log
          tail -n 120 ci/last-build.log

      - name: Collect jars
        if: steps.build.outcome == 'success'
        run: gradle collectJars --no-daemon --console=plain

      - name: Upload mod jars
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            build/dist/*.jar
            */build/libs/*.jar
          if-no-files-found: warn

      # Логи Actions качаются с results-receiver.actions.githubusercontent.com,
      # который недоступен части агентов, поэтому дублируем лог сборки
      # аннотациями чек-рана - они читаются обычным GET /check-runs/{id}/annotations.
      - name: Expose build log as check-run annotations
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse
          path = pathlib.Path('ci/last-build.log')
          if not path.exists():
              print('::error title=no-log::ci/last-build.log was not produced')
              raise SystemExit(0)
          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()[-400:]
          chunks, cur, size = [], [], 0
          for line in lines:
              cur.append(line)
              size += len(line) + 1
              if size > 6000:
                  chunks.append('\n'.join(cur)); cur, size = [], 0
          if cur:
              chunks.append('\n'.join(cur))
          total = len(chunks)
          for i, chunk in enumerate(chunks[:10]):
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=build log {i+1} of {min(total, 10)}::{escaped}")
          PY

      - name: Fail the job if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
