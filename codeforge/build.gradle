plugins {
    id 'fabric-loom'
}

version = project.codeforge_version
group = 'com.sohonet'

base {
    archivesName = 'codeforge'
}

// Часть исходников, которая НЕ зависит от отсутствующих в архиве классов
// (скрипты, плагины, безопасность, текстуры, компилятор) вынесена в
// отдельный source dir - см. src/core/java.
sourceSets {
    main {
        java {
            srcDirs += ['src/core/java']
        }
    }
}

repositories {
    // Mod Menu (опциональная интеграция, compileOnly)
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Soho API - собственный подпроект. Jar-in-jar: если soho-api уже
    // установлен отдельным файлом, Fabric использует его, иначе достанет
    // вложенную копию из META-INF/jars.
    modImplementation project(path: ':soho-api', configuration: 'namedElements')
    include project(path: ':soho-api', configuration: 'namedElements')

    // ECJ (Eclipse Compiler for Java) - чистая Java-библиотека, которая
    // компилирует скрипты прямо в рантайме. Кладём её ВНУТРЬ jar-ника
    // (META-INF/jars), поэтому игроку не нужен JDK.
    implementation 'org.eclipse.jdt:ecj:3.38.0'
    include 'org.eclipse.jdt:ecj:3.38.0'

    // Mod Menu - только для компиляции: если он установлен в игре,
    // CodeForge добавит в него свою кнопку настроек.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

loom {
    mods {
        codeforge {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Вспомогательная задача для офлайн-сборки: выгружает полный compile
// classpath (майнкрафт, маппинги, fabric api, soho api, ecj), чтобы можно
// было прогнать javac без запуска Loom.
tasks.register('dumpCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def cp = configurations.compileClasspath
    dependsOn configurations.compileClasspath
    doLast {
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = cp.files.findAll { it.exists() }.collect { it.absolutePath }.join('\n')
        println out.get().asFile
    }
}
