// Корневой проект - агрегатор. Каждый мод собирается в своём подпроекте:
//   melonoracle, codeforge, soho-api  - Fabric-моды (Loom)
//   codeforge-plugin-api             - обычная Java-библиотека
plugins {
    id 'base'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }
}

// Собирает все готовые моды в build/dist: `gradle build collectJars`.
tasks.register('collectJars') {
    group = 'build'
    description = 'Copy every built mod jar into build/dist'
    doLast {
        def dist = layout.buildDirectory.dir('dist').get().asFile
        dist.mkdirs()
        subprojects.each { p ->
            def libs = p.layout.buildDirectory.dir('libs').get().asFile
            if (libs.isDirectory()) {
                libs.listFiles().each { f ->
                    boolean isModJar = f.name.endsWith('.jar')
                        && !f.name.contains('-sources')
                        && !f.name.contains('-javadoc')
                        && !f.name.contains('-dev')
                        && !f.name.contains('-mapped')
                    if (isModJar) {
                        project.copy { from f; into dist }
                    }
                }
            }
        }
        println "Jars collected in ${dist}:"
        (dist.listFiles() ?: []).sort { it.name }.each { println " - ${it.name}" }
    }
}
